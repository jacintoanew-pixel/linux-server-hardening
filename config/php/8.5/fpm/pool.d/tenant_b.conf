[tenant_b]
user = tenant_b
group = tenant_b
listen = /run/php/php8.5-fpm-tenant_b.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 200
php_admin_value[open_basedir] = /var/www/tenant_b/:/tmp/
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[display_errors] = off
