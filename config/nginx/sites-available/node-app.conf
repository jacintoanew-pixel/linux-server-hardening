# =========================================================================
# Node.js Web Application (Reverse Proxy Hardened)
# =========================================================================

server {
    server_name app.example.com;

    # Bloqueo de archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # PWA Service Worker & Manifest
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* ^/(manifest\.json|manifest\.webmanifest)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_hide_header Content-Type;
        proxy_hide_header Cache-Control;
        add_header Content-Type "application/manifest+json; charset=utf-8" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Bloqueo de extensiones sensibles
    location ~* \.(lock|zip|tar|gz|bak|config|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Desafío certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Rate limiting estricto para autenticación
    location /api/auth/ {
        limit_req zone=auth_req burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect https://localhost:3000/ https://$host/;
        proxy_redirect http://localhost:3000/ https://$host/;
        proxy_redirect https://127.0.0.1:3000/ https://$host/;
        proxy_redirect http://127.0.0.1:3000/ https://$host/;
        proxy_read_timeout 60s;
    }

    # Reverse proxy general a Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect https://localhost:3000/ https://$host/;
        proxy_redirect http://localhost:3000/ https://$host/;
        proxy_redirect https://127.0.0.1:3000/ https://$host/;
        proxy_redirect http://127.0.0.1:3000/ https://$host/;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name app.example.com;
    return 404; # managed by Certbot
}
